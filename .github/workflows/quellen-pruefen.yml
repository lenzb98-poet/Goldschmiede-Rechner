# Vorübergehend: welche Kursverlauf-Quellen antworten von GitHub aus?
name: Quellen prüfen
on: workflow_dispatch
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node werkzeuge/quellen-pruefen.js
