# Zeichnet den Kursverlauf auf (siehe werkzeuge/verlauf-holen.js): jeden
# Werktag die Kurse von gold-api.com, mit dem EZB-Kurs in Euro, für Gold
# zusätzlich einmalig die Historie der Polnischen Nationalbank. Die Dateien
# landen unter verlauf/ und werden von der App von ihrer eigenen Adresse
# gelesen. LBMA und Stooq sperren seit Oktober 2026 jede Abfrage.
name: Kursverlauf aufzeichnen

on:
  schedule:
    - cron: "23 17 * * 1-5"   # werktags am späten Nachmittag (UTC)
    - cron: "23 8 * * 6"      # samstags: trägt den Freitag nach, falls er fehlt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kursverlauf
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kurse aufzeichnen und prüfen
        run: node werkzeuge/verlauf-holen.js verlauf
      - name: Geänderte Dateien committen
        run: |
          if git diff --quiet -- verlauf && [ -z "$(git ls-files --others --exclude-standard verlauf)" ]; then
            echo "Keine neuen Kurse."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verlauf
          git commit -m "Kursverlauf: aufgezeichnet bis $(date -u +%F)"
          git push
