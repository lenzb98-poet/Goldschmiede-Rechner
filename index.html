<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goldschmiede-Rechner</title>
<style>
  :root {
    --bg: #14120f;
    --panel: #1e1b17;
    --gold: #d4af37;
    --gold-dim: #8a7326;
    --text: #f5f1e8;
    --text-dim: #a9a297;
    --danger: #e08a4f;
    --border: #3a352c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  header {
    padding: 1.2rem 1rem 0.8rem;
    text-align: center;
  }

  header h1 {
    margin: 0;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    color: var(--gold);
  }

  nav.tabs {
    display: flex;
    overflow-x: auto;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    border-bottom: 2px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }

  nav.tabs::-webkit-scrollbar { height: 6px; }
  nav.tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .tab {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--text-dim);
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.8rem 1.2rem;
    font-size: 1.05rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab.active {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }

  main {
    padding: 1rem;
    max-width: 640px;
    margin: 0 auto;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }

  .field { margin-bottom: 1.1rem; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 1.05rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }

  .segmented {
    display: flex;
    gap: 0.5rem;
  }

  .segmented button {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.9rem 0.5rem;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }

  .segmented button.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--text);
  }

  .input-with-unit {
    position: relative;
  }

  input[type="text"] {
    width: 100%;
    font-size: 1.8rem;
    padding: 0.9rem 4rem 0.9rem 0.9rem;
    border-radius: 0.7rem;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .unit {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1.3rem;
    pointer-events: none;
  }

  .result-main {
    text-align: center;
    padding: 1.4rem 1rem;
  }

  .result-main .label {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
  }

  .result-main .value {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.1;
    word-break: break-word;
  }

  .result-main .value .unit {
    position: static;
    transform: none;
    font-size: 1.6rem;
    color: var(--gold-dim);
    margin-left: 0.3rem;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }

  .result-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.8rem;
    text-align: center;
  }

  .result-item .label {
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 0.2rem;
  }

  .result-item .value {
    font-size: 1.3rem;
    font-weight: 600;
  }

  .hint {
    text-align: center;
    color: var(--danger);
    font-size: 1.05rem;
    padding: 1rem;
  }

  .placeholder {
    text-align: center;
    color: var(--text-dim);
    font-size: 1.05rem;
    padding: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>Goldschmiede-Rechner</h1>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="ring">Ringrechner</button>
</nav>

<main>

  <section class="panel active" id="panel-ring">
    <div class="card">
      <div class="field">
        <label>Eingabe als</label>
        <div class="segmented" id="ring-mode">
          <button data-mode="umfang" class="active"># Innenumfang</button>
          <button data-mode="durchmesser">Innendurchmesser</button>
        </div>
      </div>

      <div class="field">
        <label id="ring-value-label"># Innenumfang (Ringgröße)</label>
        <div class="input-with-unit">
          <input type="text" inputmode="decimal" id="ring-value" placeholder="z. B. 54">
          <span class="unit">mm</span>
        </div>
      </div>

      <div class="field">
        <label>Materialstärke s</label>
        <div class="input-with-unit">
          <input type="text" inputmode="decimal" id="ring-thickness" placeholder="z. B. 1,5">
          <span class="unit">mm</span>
        </div>
      </div>
    </div>

    <div class="card" id="ring-output">
      <div class="placeholder">Werte eingeben, um das Ergebnis zu sehen.</div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  function parseDe(str) {
    if (typeof str !== "string") return NaN;
    str = str.trim().replace(",", ".");
    if (str === "") return NaN;
    return parseFloat(str);
  }

  function fmt(n, decimals) {
    return n.toLocaleString("de-DE", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  // --- Tab switching (generic, ready for future modules) ---
  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      var target = tab.getAttribute("data-tab");
      document.querySelectorAll(".panel").forEach(function (panel) {
        panel.classList.toggle("active", panel.id === "panel-" + target);
      });
    });
  });

  // --- Ringrechner ---
  var mode = "umfang"; // "umfang" | "durchmesser"
  var modeButtons = document.querySelectorAll("#ring-mode button");
  var valueLabel = document.getElementById("ring-value-label");
  var valueInput = document.getElementById("ring-value");
  var thicknessInput = document.getElementById("ring-thickness");
  var output = document.getElementById("ring-output");

  modeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      modeButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      mode = btn.getAttribute("data-mode");
      valueLabel.textContent = mode === "umfang"
        ? "# Innenumfang (Ringgröße)"
        : "Innendurchmesser";
      valueInput.placeholder = mode === "umfang" ? "z. B. 54" : "z. B. 17,2";
      calcRing();
    });
  });

  function calcRing() {
    var rawValue = valueInput.value;
    var rawThickness = thicknessInput.value;

    if (rawValue.trim() === "" || rawThickness.trim() === "") {
      output.innerHTML = '<div class="placeholder">Werte eingeben, um das Ergebnis zu sehen.</div>';
      return;
    }

    var value = parseDe(rawValue);
    var s = parseDe(rawThickness);

    if (isNaN(value) || isNaN(s)) {
      output.innerHTML = '<div class="hint">Bitte gültige Zahlen eingeben.</div>';
      return;
    }

    if (value <= 0 || s <= 0) {
      output.innerHTML = '<div class="hint">Bitte Werte größer als 0 eingeben.</div>';
      return;
    }

    var D, U, L;
    if (mode === "umfang") {
      U = value;
      D = U / Math.PI;
      L = U + Math.PI * s;
    } else {
      D = value;
      U = Math.PI * D;
      L = Math.PI * (D + s);
    }
    var outerD = D + 2 * s;

    output.innerHTML =
      '<div class="result-main">' +
        '<div class="label">Zuschnittlänge</div>' +
        '<div class="value">' + fmt(L, 2) + '<span class="unit">mm</span></div>' +
      '</div>' +
      '<div class="result-grid">' +
        '<div class="result-item"><div class="label">Innendurchmesser</div><div class="value">' + fmt(D, 2) + ' mm</div></div>' +
        '<div class="result-item"><div class="label"># Innenumfang</div><div class="value">' + fmt(U, 2) + ' mm</div></div>' +
        '<div class="result-item"><div class="label">Außendurchmesser</div><div class="value">' + fmt(outerD, 2) + ' mm</div></div>' +
      '</div>';
  }

  valueInput.addEventListener("input", calcRing);
  thicknessInput.addEventListener("input", calcRing);
})();
</script>

</body>
</html>
