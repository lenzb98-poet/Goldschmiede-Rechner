<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Goldschmiede-Rechner</title>
<style>
  :root {
    --bg: #14120f;
    --panel: #1e1b17;
    --gold: #d4af37;
    --gold-dim: #8a7326;
    --text: #f5f1e8;
    --text-dim: #a9a297;
    --danger: #e08a4f;
    --border: #3a352c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* --- Kopfzeile: Bildmarke + Wortmarke + Titel --- */
  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    padding: 1rem 1rem 0.9rem;
  }

  .mark {
    flex: 0 0 auto;
    width: 4.4rem;
    height: auto;
    color: var(--gold);
    display: block;
  }

  .lockup { min-width: 0; }

  .wordmark {
    font-size: 0.72rem;
    letter-spacing: 0.34em;
    color: var(--gold-dim);
    text-transform: uppercase;
    white-space: nowrap;
    margin-bottom: 0.12rem;
  }

  header h1 {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--gold);
    white-space: nowrap;
  }

  @media (max-width: 360px) {
    .mark { width: 3.4rem; }
    header h1 { font-size: 1.2rem; }
    .wordmark { font-size: 0.62rem; letter-spacing: 0.26em; }
  }

  nav.tabs {
    display: flex;
    overflow-x: auto;
    gap: 0.5rem;
    padding: 0.6rem 0.8rem;
    border-top: 1px solid var(--border);
    border-bottom: 2px solid var(--border);
    -webkit-overflow-scrolling: touch;
  }

  nav.tabs::-webkit-scrollbar { height: 6px; }
  nav.tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .tab {
    flex: 0 0 auto;
    background: var(--panel);
    color: var(--text-dim);
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.8rem 1.2rem;
    font-size: 1.05rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }

  .tab.active {
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
  }

  .tab.pending { opacity: 0.62; }
  .tab.pending.active { opacity: 1; }

  main {
    padding: 1rem;
    max-width: 640px;
    margin: 0 auto;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 1.2rem;
    margin-bottom: 1rem;
  }

  .field { margin-bottom: 1.1rem; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 1.05rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }

  .segmented {
    display: flex;
    gap: 0.5rem;
  }

  .segmented button {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.9rem 0.5rem;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
  }

  .segmented button.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--text);
  }

  .input-with-unit { position: relative; }

  input[type="text"] {
    width: 100%;
    font-size: 1.8rem;
    padding: 0.9rem 4rem 0.9rem 0.9rem;
    border-radius: 0.7rem;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .unit {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 1.3rem;
    pointer-events: none;
  }

  .result-main {
    text-align: center;
    padding: 1.4rem 1rem;
  }

  .result-main .label {
    font-size: 1.1rem;
    color: var(--text-dim);
    margin-bottom: 0.3rem;
  }

  .result-main .value {
    font-size: 3.2rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1.1;
    word-break: break-word;
  }

  .result-main .value .unit {
    position: static;
    transform: none;
    font-size: 1.6rem;
    color: var(--gold-dim);
    margin-left: 0.3rem;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }

  .result-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.8rem;
    text-align: center;
  }

  .result-item .label {
    font-size: 0.9rem;
    color: var(--text-dim);
    margin-bottom: 0.2rem;
  }

  .result-item .value {
    font-size: 1.3rem;
    font-weight: 600;
  }

  .hint {
    text-align: center;
    color: var(--danger);
    font-size: 1.05rem;
    padding: 1rem;
  }

  .placeholder {
    text-align: center;
    color: var(--text-dim);
    font-size: 1.05rem;
    padding: 1rem;
  }

  /* --- noch nicht gebaute Module --- */
  .soon h2 {
    margin: 0 0 0.5rem;
    font-size: 1.35rem;
    color: var(--gold);
  }

  .soon p {
    margin: 0 0 1.1rem;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--text-dim);
  }

  .badge {
    display: inline-block;
    border: 2px dashed var(--gold-dim);
    border-radius: 0.6rem;
    padding: 0.6rem 1rem;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--gold-dim);
  }
</style>
</head>

<main id="panels">

  <section class="panel active" id="panel-ring">
    <div class="card">
      <div class="field">
        <label>Eingabe als</label>
        <div class="segmented" id="ring-mode">
          <button data-mode="umfang" class="active"># Innenumfang</button>
          <button data-mode="durchmesser">Innendurchmesser</button>
        </div>
      </div>

      <div class="field">
        <label id="ring-value-label"># Innenumfang (Ringgröße)</label>
        <div class="input-with-unit">
          <input type="text" inputmode="decimal" enterkeyhint="next" id="ring-value" placeholder="z. B. 54">
          <span class="unit">mm</span>
        </div>
      </div>

      <div class="field">
        <label>Materialstärke s</label>
        <div class="input-with-unit">
          <input type="text" inputmode="decimal" enterkeyhint="done" id="ring-thickness" placeholder="z. B. 1,5">
          <span class="unit">mm</span>
        </div>
      </div>
    </div>

    <div class="card" id="ring-output">
      <div class="placeholder">Werte eingeben, um das Ergebnis zu sehen.</div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  function parseDe(str) {
    if (typeof str !== "string") return NaN;
    str = str.trim().replace(",", ".");
    if (str === "") return NaN;
    return parseFloat(str);
  }

  function fmt(n, decimals) {
    return n.toLocaleString("de-DE", {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    });
  }

  // --- Module, die noch kommen (Kurzbeschreibungen aus der Spezifikation) ---
  var kommende = [
    { id: "umfang",   tab: "Umfang & Ø",  titel: "2 · Umfang und Durchmesser",
      text: "Reiner Umrechner in beide Richtungen, dazu eine Ringgrößentabelle zum Nachschlagen." },
    { id: "legierung", tab: "Legierung",       titel: "3 · Legierungsrechnung",
      text: "Wie viel Feingold und wie viel Zuschlag für x Gramm in y Karat. Dazu der umgekehrte Fall: vorhandenes Material hochlegieren oder abstrecken." },
    { id: "schliff",  tab: "Schliffformen",    titel: "4 · Schliffformen",
      text: "Nachschlagetafel mit Name und Umriss." },
    { id: "stein",    tab: "Steingewicht",     titel: "5 · Steingewicht",
      text: "Maße plus Schliffform plus Steinart ergibt das Karatgewicht. Maße × Formfaktor × Dichte, die Rundistenstärke kommt als Zuschlag dazu." },
    { id: "wert",     tab: "Materialwert",     titel: "6 · Materialwert",
      text: "Gewicht plus Feingehalt plus Tagespreis ergibt den Wert. Praktisch beim Umschmelzen von Altgold." },
    { id: "einheiten", tab: "Einheiten",       titel: "7 · Einheiten",
      text: "mm, Gramm, Karat, Pennyweight, Unze." },
    { id: "mohs",     tab: "Mohshärte",   titel: "8 · Mohshärte",
      text: "Nachschlag, bei dem Stein, Name und Härte zusammen zu sehen sind." }
  ];

  var tabBar = document.getElementById("tabs");
  var panelHost = document.getElementById("panels");

  kommende.forEach(function (m) {
    var btn = document.createElement("button");
    btn.className = "tab pending";
    btn.setAttribute("data-tab", m.id);
    btn.textContent = m.tab;
    tabBar.appendChild(btn);

    var sec = document.createElement("section");
    sec.className = "panel";
    sec.id = "panel-" + m.id;
    sec.innerHTML =
      '<div class="card soon">' +
        '<h2></h2>' +
        '<p></p>' +
        '<div class="badge">wird bald erstellt</div>' +
      '</div>';
    sec.querySelector("h2").textContent = m.titel;
    sec.querySelector("p").textContent = m.text;
    panelHost.appendChild(sec);
  });

  // --- Tab-Umschaltung ---
  var tabs = tabBar.querySelectorAll(".tab");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("active"); });
      tab.classList.add("active");
      var target = tab.getAttribute("data-tab");
      document.querySelectorAll(".panel").forEach(function (panel) {
        panel.classList.toggle("active", panel.id === "panel-" + target);
      });
    });
  });

  // --- Enter springt ins nächste Eingabefeld desselben Panels ---
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    var panel = el.closest(".panel");
    if (!panel) return;

    e.preventDefault();
    var felder = Array.prototype.slice.call(panel.querySelectorAll("input"));
    var next = felder[felder.indexOf(el) + 1];
    if (next) {
      next.focus();
      next.select();
    } else {
      el.blur();   // letztes Feld: Tastatur schließen
    }
  });

  // --- Modul 1: Ringrechner ---
  var mode = "umfang"; // "umfang" | "durchmesser"
  var modeButtons = document.querySelectorAll("#ring-mode button");
  var valueLabel = document.getElementById("ring-value-label");
  var valueInput = document.getElementById("ring-value");
  var thicknessInput = document.getElementById("ring-thickness");
  var output = document.getElementById("ring-output");

  modeButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      modeButtons.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      mode = btn.getAttribute("data-mode");
      valueLabel.textContent = mode === "umfang"
        ? "# Innenumfang (Ringgröße)"
        : "Innendurchmesser";
      valueInput.placeholder = mode === "umfang" ? "z. B. 54" : "z. B. 17,2";
      calcRing();
    });
  });

  function calcRing() {
    var rawValue = valueInput.value;
    var rawThickness = thicknessInput.value;

    if (rawValue.trim() === "" || rawThickness.trim() === "") {
      output.innerHTML = '<div class="placeholder">Werte eingeben, um das Ergebnis zu sehen.</div>';
      return;
    }

    var value = parseDe(rawValue);
    var s = parseDe(rawThickness);

    if (isNaN(value) || isNaN(s)) {
      output.innerHTML = '<div class="hint">Bitte gültige Zahlen eingeben.</div>';
      return;
    }

    if (value <= 0 || s <= 0) {
      output.innerHTML = '<div class="hint">Bitte Werte größer als 0 eingeben.</div>';
      return;
    }

    var D, U, L;
    if (mode === "umfang") {
      U = value;
      D = U / Math.PI;
      L = U + Math.PI * s;
    } else {
      D = value;
      U = Math.PI * D;
      L = Math.PI * (D + s);
    }
    var outerD = D + 2 * s;

    output.innerHTML =
      '<div class="result-main">' +
        '<div class="label">Zuschnittlänge</div>' +
        '<div class="value">' + fmt(L, 2) + '<span class="unit">mm</span></div>' +
      '</div>' +
      '<div class="result-grid">' +
        '<div class="result-item"><div class="label">Innendurchmesser</div><div class="value">' + fmt(D, 2) + ' mm</div></div>' +
        '<div class="result-item"><div class="label"># Innenumfang</div><div class="value">' + fmt(U, 2) + ' mm</div></div>' +
        '<div class="result-item"><div class="label">Außendurchmesser</div><div class="value">' + fmt(outerD, 2) + ' mm</div></div>' +
      '</div>';
  }

  valueInput.addEventListener("input", calcRing);
  thicknessInput.addEventListener("input", calcRing);
})();
</script>

</body>
</html>
